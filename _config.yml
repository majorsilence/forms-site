title: Majorsilence.Forms
tagline: WinForms in. Cross-platform out.
# Used verbatim as the site-wide <meta name="description"> and og:description fallback, so it is
# written for a search result snippet rather than as prose: the phrases people actually type
# ("cross-platform WinForms", "WinForms compatibility layer", "run WinForms on Linux/macOS") come
# first, and the whole thing stays under ~160 characters so Google doesn't truncate it.
description: >-
  Open-source cross-platform WinForms library for .NET — a Windows Forms compatibility layer that
  runs your apps on Windows, macOS, Linux and the browser, without a rewrite.
url: "https://forms.majorsilence.com"
baseurl: ""
repository: majorsilence/forms-site
github_url: "https://github.com/majorsilence/Majorsilence.Forms"
nuget_url: "https://www.nuget.org/packages/Majorsilence.Forms"

# ── SEO / social ─────────────────────────────────────────────────────────────────
lang: en
locale: en_US
author: Majorsilence
og_image: /assets/img/og-default.png
og_image_alt: >-
  Majorsilence.Forms — the same WinForms app running on Windows, macOS and Linux.

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: true

permalink: /blog/:year/:month/:day/:title/

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: en
  - scope:
      path: ""
    values:
      layout: default
      lang: en
  # Translated pages live under their language prefix; the scope sets `lang` so a translation
  # only has to carry its permalink. Posts set `lang` in their own front matter.
  - scope:
      path: "zh"
    values:
      lang: zh
  - scope:
      path: "fr"
    values:
      lang: fr
  - scope:
      path: "si"
    values:
      lang: si
  - scope:
      path: "ta"
    values:
      lang: ta

# ── Languages ────────────────────────────────────────────────────────────────────
# Every page exists once per enabled language, at the same path under the language prefix
# (/getting-started/ → /zh/getting-started/ → /fr/getting-started/). That convention is what
# lets the layouts build the language switcher and the hreflang alternates without a lookup
# table: strip the current prefix off page.url, prepend each other language's prefix, and
# check the result exists. Nav labels, footer labels and the UI strings live in _data/i18n/<code>.yml.
#
# To add a language: add it here, add _data/i18n/<code>.yml, translate the pages into
# /<code>/..., then flip `enabled: true`. A disabled language is simply absent from the switcher,
# the sitemap alternates and the feeds. See BACKLOG.md for the ones queued (Sinhala, Tamil).
default_lang: en
languages:
  - code: en
    name: English
    locale: en_US
    prefix: ""
    enabled: true
  - code: zh
    name: 中文
    locale: zh_CN
    prefix: /zh
    enabled: true
  - code: fr
    name: Français
    locale: fr_FR
    prefix: /fr
    enabled: true
  - code: si
    name: සිංහල
    locale: si_LK
    prefix: /si
    enabled: false
  - code: ta
    name: தமிழ்
    locale: ta_LK
    prefix: /ta
    enabled: false

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - BACKLOG.md
  - vendor
  # Working directories the Pages workflow creates in-tree when it builds the browser
  # gallery. It already sequences those steps after the Jekyll build so Jekyll never
  # sees them; this is the safety net if that order is ever changed.
  - forms
  - wasm-publish
