# The footer sitemap. Beyond being useful navigation, this is the site's internal-linking
# backbone: every page links to every other with descriptive anchor text, which is how the
# keyword landing pages get crawled and get a share of the home page's authority.
footer_links:
  - heading: Start
    items:
      - label: Getting started
        url: /getting-started/
      - label: Migrate a WinForms app
        url: /migration/
      - label: Training guide
        url: /training/
      - label: Samples
        url: /samples/
