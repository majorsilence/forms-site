    Majorsilence.Forms — la même application WinForms sous Windows, macOS et Linux.
  footer_blurb: >-
    WinForms multiplateforme pour .NET. Exécutez vos applications Windows Forms sous Windows,
    macOS, Linux, sur mobile et dans le navigateur — sans réécriture.

