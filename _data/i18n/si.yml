# සිංහල අතුරුමුහුණත් පෙළ. _data/i18n/en.yml හි ඇති යතුරුම (keys) මෙහිද ඇත.

site:
  tagline: WinForms ඇතුළට. බහු-වේදිකා ලෙස පිටතට.
  description: >-
    .NET සඳහා විවෘත-මූලාශ්‍ර බහු-වේදිකා WinForms පුස්තකාලය — ඔබගේ යෙදුම් නැවත ලිවීමකින් තොරව
    Windows, macOS, Linux සහ බ්‍රවුසරය මත ධාවනය කරන Windows Forms ගැළපුම් ස්තරයකි.
  og_image_alt: >-
    Majorsilence.Forms — එකම WinForms යෙදුම Windows, macOS සහ Linux මත ධාවනය වේ.
  footer_blurb: >-
    .NET සඳහා බහු-වේදිකා WinForms. ඔබගේ Windows Forms යෙදුම් Windows, macOS, Linux, ජංගම
    උපාංග සහ බ්‍රවුසරය මත ධාවනය කරන්න — නැවත ලිවීමකින් තොරව.

