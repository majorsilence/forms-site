---
layout: default
---
{%- include lang-vars.html -%}
<article class="msf-prose">
  <a class="msf-back-link" href="{{ prefix | append: '/' | relative_url }}">&larr; {{ t.ui.back_home }}</a>
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}<p class="msf-prose__meta">{{ page.subtitle }}</p>{% endif %}
  {% if lang != site.default_lang %}<p class="msf-translation-note">{{ t.ui.translation_note | strip_newlines | strip }} <a href="{{ base_path | relative_url }}" hreflang="en" lang="en">English</a></p>{% endif %}
  {{ content }}
</article>
